<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burka's STEM Academy</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #06b6d4;
            --dark: #0f172a;
            --light: #f8fafc;
            --accent: #f43f5e;
            --math-color: #3b82f6;
            --chem-color: #10b981;
            --bio-color: #8b5cf6;
            --phys-color: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.95);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #e0e7ff 0%, #ccfbf1 100%);
            background-attachment: fixed;
            color: var(--dark);
            overflow-x: hidden;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Smooth Floating Animation for Developer Logo Box */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Top Hero Layout with Floating Box */
        .header-layout {
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            gap: 30px;
            align-items: center;
            padding: 50px 0 30px 0;
        }

        .profile-art-placeholder {
            background: linear-gradient(45deg, #818cf8, #22d3ee);
            border-radius: 20px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3.5rem;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
            animation: float 4s ease-in-out infinite;
        }

        .profile-art-placeholder span {
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .hero-text h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.15rem;
            color: #475569;
        }

        /* Subject Cards Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .subject-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
        }

        .card-math::before { background: var(--math-color); }
        .card-chem::before { background: var(--chem-color); }
        .card-bio::before { background: var(--bio-color); }
        .card-phys::before { background: var(--phys-color); }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        }

        .subject-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .subject-card h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .subject-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .explore-btn {
            background: #f1f5f9;
            color: var(--dark);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            text-decoration: none;
        }

        .subject-card:hover .explore-btn {
            background: var(--primary);
            color: white;
        }

        /* Interactive Study Workspace Section */
        .workspace-box {
            background: linear-gradient(135deg, var(--dark) 0%, #1e1b4b 100%);
            color: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .workspace-box h2 {
            font-size: 1.6rem;
            font-family: var(--font-mono);
            margin-bottom: 15px;
            text-align: center;
        }

        /* Tabs system */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            min-height: 180px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h4 {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #22d3ee;
        }

        .topic-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .topic-list li {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            border-left: 3px solid var(--secondary);
        }

        @media (max-width: 768px) {
            .header-layout {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 30px 0;
            }
            .profile-art-placeholder {
                height: 140px;
                width: 140px;
                margin: 0 auto;
                font-size: 2.8rem;
            }
            .hero-text h1 {
                font-size: 2rem;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">⚡ burka.dev</a>
        <ul class="nav-links">
            <li><a href="#subjects">📚 Subjects</a></li>
            <li><a href="#workspace">🧪 Practice Arena</a></li>
        </ul>
    </nav>

    <main class="container">
        
        <!-- Top Clean Header Area with your favorite Animated Box -->
        <header class="header-layout">
            <div class="profile-art-placeholder">
                🚀 <span>burka.dev</span>
            </div>
            <div class="hero-text">
                <h1>STEM Learning Portal</h1>
                <p>Welcome to your interactive ecosystem for mastering core scientific disciplines. Select an arena below to start practicing.</p>
            </div>
        </header>

        <!-- Subjects Showcase Section -->
