<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burka's Math & Code Gallery</title>
    
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Modern CSS Variables for Design Tokens */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #06b6d4;
            --dark: #0f172a;
            --light: #f8fafc;
            --accent: #f43f5e;
            --card-bg: rgba(255, 255, 255, 0.9);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
        }

        /* Base & Reset Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { 
            font-family: var(--font-sans); 
            background: linear-gradient(135deg, #e0e7ff 0%, #ccfbf1 100%);
            background-attachment: fixed;
            color: var(--dark); 
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }

        /* Elegant Navigation Bar */
        nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .logo {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
            position: relative;
            padding: 5px 0;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }

        /* Hero Showcase Section */
        .hero {
            padding: 80px 5% 60px 5%;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }
        .badge {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 70, 229, 0.2);
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.2rem;
            color: #475569;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        /* Main Container System */
        .container {
            max-width: 1100px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        /* Profile Interactive Card */
        .profile-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            text-align: left;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }
        .profile-card.visible { opacity: 1; transform: translateY(0); }
        
        .profile-art-placeholder {
            background: linear-gradient(45deg, #818cf8, #22d3ee);
            border-radius: 16px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: var(--font-mono);
            font-size: 3rem;
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.2);
            animation: float 4s ease-in-out infinite;
        }
        .profile-art-placeholder span { font-size: 1rem; margin-top: 10px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 20px; }

        .profile-details h2 { font-size: 2rem; margin-bottom: 15px; color: var(--dark); }
        .profile-details p { color: #475569; margin-bottom: 15px; font-size: 1.05rem; }
        
        /* Stats Grid Dashboard */
        .stats-grid { display: flex; gap: 15px; margin-top: 25px; }
        .stat-box {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 12px;
            flex: 1;
            text-align: center;
        }
        .stat-num { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 0.8rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.5px; }

        /* Dynamic Grid Layout for Comic Panels */
        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .comic-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
        }
        .comic-card.visible { opacity: 1; transform: translateY(0); }
        .comic-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.1);
            border-color: rgba(79, 70, 229, 0.3);
        }
        
        .card-image-slot {
            height: 200px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            position: relative;
            overflow: hidden;
        }
        .card-image-slot svg { width: 45px; height: 45px; margin-bottom: 10px; fill: #cbd5e1; transition: fill 0.3s; }
        .comic-card:hover .card-image-slot svg { fill: var(--primary); }
        
        .pulse-dot {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            background: #f59e0b;
            border-radius: 50%;
        }
        .pulse-active { animation: pulseGlow 2s infinite; background: var(--primary); }

        .card-body { padding: 25px; text-align: left; }
        .card-body .status-badge {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
        }
        .card-body .status-ready { background: #dcfce7; color: #15803d; }
        .card-body h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--dark); }
        .card-body p { color: #64748b; font-size: 0.95rem; }

        /* Interactive Feedback/Launch System */
        .feedback-box {
            background: linear-gradient(135deg, var(--dark) 0%, #1e1b4b 100%);
            color: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-top: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .feedback-box h2 { font-size: 2rem; font-family: var(--font-mono); margin-bottom: 15px; }
